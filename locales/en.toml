# ── Tooltips (shown on hover) ──────────────────────────────────────────────
tip_start = "Starts the loaded session. Every trial is saved as soon as it is answered. Enter or Space starts it too while the dashboard has the keyboard."
tip_pause = "Pauses once the trial under way is answered; Resume continues."
tip_resume = "Continues a paused session where it stopped."
tip_end_message = "End the message as the participant's key would"
tip_break_waits_for = "Whether the participant's key ends a break, or only the operator's Resume"
tip_undo = "Takes back the last answered trial; its condition is presented again later."
tip_stop = "Ends the session for good, without waiting for the answer to the trial under way. What was measured stays and counts, but the session cannot be continued. Press twice to confirm."
tip_discard = "Sets the session in hand aside: its file moves into the discarded directory beside it and does not count. A session still running is stopped first. In Browse, Delete does the same to the chosen file."
discard_session = "Discard Session…"
discard_title = "Discard?"
discard_question = "{file} is set aside in the discarded directory beside it and leaves the library; restore_discarded brings it back. A session still running is stopped first."
cancel = "Cancel"
tip_keys = "The response keys work while this window has the keyboard; a text field takes them while you type in it."
tip_parameters_edit_prepares = "These are what the session measured. A change prepares a new session of this experiment, which Start New Session runs; this one stays as it was."
tip_parameters_prepared = "Data and Trials still show the session that ended, which stays in Browse."
tip_mark_outlier = "The trial no longer counts in the plot and the analysis; it stays in the file."
tip_replace_next = "Presents this condition again once the trial under way is answered; the new answer takes the place of this one."
tip_replace_now = "Abandons the trial under way and presents this condition at once; the new answer takes the place of this one, and the abandoned trial comes again after it. Only while a trial awaits its answer."
tip_add_next = "Presents this condition again once the trial under way is answered; this answer stays, and the new one is added to it."
tip_add_now = "Abandons the trial under way and presents this condition at once; this answer stays, and the abandoned trial comes again after it. Only while a trial awaits its answer."
tip_condition_next = "Presents this condition once the trial under way is answered; its answer is added to the others."
tip_condition_now = "Abandons the trial under way and presents this condition at once; the abandoned trial comes again after it. Only while a trial awaits its answer."
tip_show_not_counted = "Also lists undone trials and outliers."
tip_show_trial_points = "Draws every recorded trial beside the averages; right-click one to correct it. Trials that no longer count are drawn as red rings."
tip_show_means = "Draws each level's mean — of the scored answers, a proportion — with its error bar; right-click one to present that condition again."
tip_plot_spread = "Error bars on the condition means: none, standard deviation, standard error, or 95% confidence interval."
tip_plot_smooth = "Draws a 3-level moving average through the condition means, without assuming a model."
tip_plot_fit = "Draws the fitted logistic psychometric curve when the data determine one."
tip_plot_converted = "Shows levels and responses in each session's declared units; switch off to inspect the recorded values."
tip_plot_split = "How ticked sessions are shown: pooled within each series, overlaid in one plot, or in separate panels."
tip_plot_earlier_sessions = "Draws the other sessions of this series, pooled, as a dimmed reference line under the live plot."
tip_untick_session = "Untick to remove this session from the Data view."
tip_refresh = "Rereads the session now, whatever the update setting."
